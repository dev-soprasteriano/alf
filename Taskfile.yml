version: '3'

tasks:
  update-upstream:
    desc: Move unpinned upstream skills to latest. SKILL=name moves one upstream skill, REF=rev pins it, DRY_RUN=1 only plans.
    cmds:
      - scripts/update-upstream.sh update {{if .DRY_RUN}}--dry-run {{end}}{{if .REF}}--ref {{.REF}} {{end}}{{if .SKILL}}{{.SKILL}}{{end}}

  build-apm:
    desc: Build the APM skill bundles, dist/user-apm.yml and the plugin manifest dist/.claude-plugin/plugin.json from src/skills and src/upstream. Fails when README.md differs from src/. Commit dist/ with the change.
    cmds:
      - scripts/build-apm.sh

  ci:
    desc: Run the same checks as CI.
    cmds:
      - task: ci:build
      - task: ci:skillspector
      - task: ci:apm-audit
      - task: ci:sbom

  ci:staged:
    desc: Run the same checks on the staged files.
    cmds:
      - task: ci:build
      - task: ci:skillspector
        vars: {STAGED: "1"}
      - task: ci:apm-audit
        vars: {STAGED: "1"}

  ci:build:
    desc: Check dist/ and README.md match src/, and run the script tests.
    preconditions:
      - sh: command -v jq
        msg: "jq not found. Install it with: brew install jq"
    cmds:
      - scripts/build-apm.sh --check
      - sh scripts/test-changed-skills.sh
      - sh scripts/test-apm-audit-ci.sh
      - sh scripts/test-build-apm-readme.sh
      - sh scripts/test-build-sbom.sh

  ci:skillspector:
    desc: Scan every alf skill and upstream skill with SkillSpector, static only (no LLM). STAGED=1 scans only the skill folders of the staged files.
    preconditions: &jq
      - sh: command -v jq
        msg: "jq not found. Install it with: brew install jq"
    cmds:
      - sh scripts/install-tools.sh skillspector
      - sh scripts/skillspector-ci.sh{{if .STAGED}} --staged{{end}}

  ci:apm-audit:
    desc: Scan every file in dist/ for hidden Unicode with apm audit. STAGED=1 scans only the staged files under dist/.
    preconditions: *jq
    cmds:
      - sh scripts/install-tools.sh apm
      - sh scripts/apm-audit-ci.sh{{if .STAGED}} --staged{{end}}

  sbom:
    desc: Generate the SBOM of the shipped bundles in sbom/ (CycloneDX). The SBOM workflow runs this on each push to main. See docs/sbom.md.
    preconditions: *jq
    cmds:
      - sh scripts/install-tools.sh check-jsonschema
      - scripts/build-sbom.sh

  ci:sbom:
    desc: Check the SBOM as the pull request check does, the schemas and the bundle licenses. Writes no files.
    preconditions: *jq
    cmds:
      - sh scripts/install-tools.sh check-jsonschema
      - scripts/build-sbom.sh --check

  tools:lock:
    desc: Regenerate tools/<TOOL>/requirements.txt, with hashes, from tools/<TOOL>/requirements.in. Run after editing requirements.in, and commit both files.
    requires:
      vars: [TOOL]
    cmds:
      - sh scripts/lock-tool.sh "{{.TOOL}}"

  setup:
    desc: Set up a fresh clone (git hooks and project skills).
    cmds:
      - task: hooks:install
      - task: skills:install

  skills:install:
    desc: Install the pinned project skills from apm.lock.yaml into .agents/skills/ and .claude/skills/.
    cmds:
      - sh scripts/install-tools.sh apm
      - .tools/apm/bin/apm install --frozen

  skills:update:
    desc: Move apm.lock.yaml to the latest alf skills on main.
    cmds:
      - sh scripts/install-tools.sh apm
      - .tools/apm/bin/apm update --yes

  hooks:install:
    desc: Point this clone's git hooks at .githooks. Run once per clone.
    cmds:
      - git config --local core.hooksPath .githooks
