version: '3'

vars:
  SKILLSPECTOR_SOURCE: "git+https://github.com/NVIDIA/skillspector.git@v2.13.4"

tasks:
  update-upstream:
    desc: Move unpinned upstream skills to latest. SKILL=name moves one upstream skill, REF=rev pins it, DRY_RUN=1 only plans.
    cmds:
      - scripts/update-upstream.sh update {{if .DRY_RUN}}--dry-run {{end}}{{if .REF}}--ref {{.REF}} {{end}}{{if .SKILL}}{{.SKILL}}{{end}}

  ci:
    desc: Scan the alf skills and upstream skills with SkillSpector, static only (no LLM). CI runs this same task.
    preconditions:
      - sh: command -v uvx
        msg: "uvx not found. Install uv with: brew install uv"
      - sh: command -v jq
        msg: "jq not found. Install it with: brew install jq"
    cmds:
      - sh scripts/skillspector-ci.sh

  hooks:install:
    desc: Point this clone's git hooks at .githooks. Run once per clone.
    cmds:
      - git config --local core.hooksPath .githooks
