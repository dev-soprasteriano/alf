version: '3'

vars:
  SKILLSPECTOR_SOURCE: "git+https://github.com/NVIDIA/skillspector.git@v2.13.4"

tasks:
  update-upstream:
    desc: Move unpinned upstream skills to latest. SKILL=name moves one upstream skill, REF=rev pins it, DRY_RUN=1 only plans.
    cmds:
      - scripts/update-upstream.sh update {{if .DRY_RUN}}--dry-run {{end}}{{if .REF}}--ref {{.REF}} {{end}}{{if .SKILL}}{{.SKILL}}{{end}}

  build-apm:
    desc: Build the APM skill bundles and dist/user-apm.yml from src/skills and src/upstream. Commit dist/ with the change.
    cmds:
      - scripts/build-apm.sh

  ci:
    desc: Check dist/ matches a fresh build, run the scope tests, then scan every alf skill and upstream skill with SkillSpector, static only (no LLM). CI runs this same task.
    preconditions:
      - sh: command -v uvx
        msg: "uvx not found. Install uv with: brew install uv"
      - sh: command -v jq
        msg: "jq not found. Install it with: brew install jq"
    cmds:
      - scripts/build-apm.sh --check
      - sh scripts/test-changed-skills.sh
      - sh scripts/skillspector-ci.sh

  ci:staged:
    desc: Pre-commit check. Checks dist/ matches a fresh build, runs the scope tests, then scans only the skill folders of the staged files. Scans every skill when the staged files include .skillspector-baseline.yaml, Taskfile.yml, scripts/skillspector-ci.sh or scripts/changed-skills.sh.
    preconditions:
      - sh: command -v uvx
        msg: "uvx not found. Install uv with: brew install uv"
      - sh: command -v jq
        msg: "jq not found. Install it with: brew install jq"
    cmds:
      - scripts/build-apm.sh --check
      - sh scripts/test-changed-skills.sh
      - sh scripts/skillspector-ci.sh --staged

  hooks:install:
    desc: Point this clone's git hooks at .githooks. Run once per clone.
    cmds:
      - git config --local core.hooksPath .githooks
