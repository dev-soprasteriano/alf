# SkillSpector is not on PyPI. .github/workflows/update-skillspector.yml updates it.
version: 2
updates:
  - package-ecosystem: uv
    directories:
      - /tools/apm
      - /tools/check-jsonschema
      - /tools/uv
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
